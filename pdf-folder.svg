<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="20" height="20" fill="none" role="img" aria-label="Open PDF Folder">
  <title>Open PDF Folder</title>
  <desc>Full-optical-scale airy wire-frame folder with coral-orange launch arrow aligned with the Zotero Flow icon family.</desc>
  <defs>
    <linearGradient id="ztfFolderStroke" x1="12" y1="24" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="ztfFolderFill" x1="14" y1="30" x2="106" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.09" />
    </linearGradient>
    <linearGradient id="ztfFolderArrow" x1="68" y1="16" x2="116" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Soft Translucent Folder Body -->
  <path d="M 14 36 C 14 28.5 19.5 23 27 23 H 50 L 62 35 H 96 C 103.5 35 109 40.5 109 48 V 98 C 109 105.5 103.5 111 96 111 H 27 C 19.5 111 14 105.5 14 98 Z" fill="url(#ztfFolderFill)" />

  <!-- Open Wire-Frame Folder Outline (leaves top-right open for launch arrow) -->
  <path d="M 65 35 H 52 L 42 23 H 27 C 19.5 23 14 28.5 14 36 V 98 C 14 105.5 19.5 111 27 111 H 96 C 103.5 111 109 105.5 109 98 V 68" stroke="url(#ztfFolderStroke)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Inner Folder Flap Line -->
  <path d="M 16 54 H 66" stroke="#0EA5E9" stroke-width="10" stroke-linecap="round" opacity="0.88" />

  <!-- Breaking-Out Coral-Orange Launch Arrow -->
  <path d="M 78 50 L 112 16 M 86 16 H 112 V 42" stroke="url(#ztfFolderArrow)" stroke-width="12.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
